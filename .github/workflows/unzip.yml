name: Unzip Archive
on:
  push:
    paths:
      - 'archive.zip'  # Сработает при загрузке файла с таким именем
  workflow_dispatch:    # Или запустите вручную из вкладки Actions

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          # 7z установлен на раннерах GitHub по умолчанию[reference:4]
          7z x archive.zip -o./extracted_files/  # Распаковка в папку extracted_files

      - name: Commit and push extracted files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add extracted_files/
          git commit -m "Auto-unzip archive" || exit 0
          git push
