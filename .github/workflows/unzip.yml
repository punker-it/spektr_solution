name: Unzip Archive
on:
  push:
    paths:
      - '.last_version.zip'
  workflow_dispatch:

# ✨ Добавьте этот блок, чтобы дать права на запись
permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Явно передаем токен для последующего push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract archive
        run: |
          7z x .last_version.zip -o./extracted_files/

      - name: Commit and push extracted files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add extracted_files/
          git commit -m "Auto-unzip archive" || exit 0
          git push
